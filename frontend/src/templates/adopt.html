<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>領養申請 - 寵物領養平台</title>
    <link rel="stylesheet" href="/src/asserts/styles/styles.css">
    <link rel="icon" href="/src/asserts/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>領養申請</h1>
        </div>
        <div class="header-right">
            <a href="/" class="button">返回首頁</a>
        </div>
    </header>

    <main class="adoption-page">
        <section class="adoption-card">
            <div class="auth-card-header">
                <p class="auth-kicker">Adoption Request</p>
                <h1>填寫領養申請</h1>
                <p>請確認你已準備好長期照顧寵物。送出後可在會員中心追蹤申請進度。</p>
            </div>

            <form id="adoption-form" class="auth-form">
                <div class="auth-field">
                    <label for="pet_id">寵物 ID</label>
                    <input type="text" id="pet_id" name="pet_id" readonly required>
                </div>

                <div class="auth-field">
                    <label for="name">姓名</label>
                    <input type="text" id="name" name="name" placeholder="請輸入姓名" required>
                </div>

                <div class="auth-field">
                    <label for="phone">電話</label>
                    <input type="tel" id="phone" name="phone" placeholder="請輸入電話" required>
                </div>

                <div class="auth-field">
                    <label for="email">電子信箱</label>
                    <input type="email" id="email" name="email" placeholder="請輸入電子信箱" required>
                </div>

                <div class="auth-field">
                    <label for="housing_type">居住型態</label>
                    <select id="housing_type" name="housing_type" required>
                        <option value="">請選擇</option>
                        <option value="自有住宅">自有住宅</option>
                        <option value="租屋">租屋</option>
                        <option value="與家人同住">與家人同住</option>
                        <option value="宿舍">宿舍</option>
                    </select>
                </div>

                <div class="auth-field">
                    <label for="pet_allowed">住處是否可養寵物</label>
                    <select id="pet_allowed" name="pet_allowed" required>
                        <option value="">請選擇</option>
                        <option value="yes">可以</option>
                        <option value="no">不確定或不可以</option>
                    </select>
                </div>

                <div class="auth-field">
                    <label for="has_other_pets">家中是否有其他寵物</label>
                    <select id="has_other_pets" name="has_other_pets" required>
                        <option value="">請選擇</option>
                        <option value="yes">有</option>
                        <option value="no">沒有</option>
                    </select>
                </div>

                <div class="auth-field">
                    <label for="daily_company_time">每天可陪伴時間</label>
                    <select id="daily_company_time" name="daily_company_time" required>
                        <option value="">請選擇</option>
                        <option value="少於 1 小時">少於 1 小時</option>
                        <option value="1-3 小時">1-3 小時</option>
                        <option value="3-6 小時">3-6 小時</option>
                        <option value="6 小時以上">6 小時以上</option>
                    </select>
                </div>

                <div class="auth-field">
                    <label for="experience">是否有飼養經驗</label>
                    <select id="experience" name="experience" required>
                        <option value="">請選擇</option>
                        <option value="yes">有</option>
                        <option value="no">沒有</option>
                    </select>
                </div>

                <div class="auth-field">
                    <label for="message">補充說明</label>
                    <textarea id="message" name="message" placeholder="可以簡單說明居住環境、照顧經驗或想領養的原因"></textarea>
                </div>

                <div class="adoption-confirmations">
                    <label><input type="checkbox" id="family_agreement"> 我確認家人或同住者已知情並同意</label>
                    <label><input type="checkbox" id="follow_up_agreement"> 我願意接受後續聯繫與追蹤</label>
                    <label><input type="checkbox" id="responsibility_agreement"> 我了解領養是長期責任，並願意提供穩定照顧</label>
                </div>

                <button type="submit" class="auth-submit">送出申請</button>
            </form>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const petId = params.get("pet_id");
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        const petIdInput = document.getElementById("pet_id");

        if (petId) {
            petIdInput.value = petId;
        } else {
            petIdInput.placeholder = "請先從寵物詳細頁進入申請";
        }

        if (currentUser) {
            document.getElementById("phone").value = currentUser.phone || "";
        }

        document.getElementById("adoption-form").addEventListener("submit", function(event) {
            event.preventDefault();

            const confirmations = {
                family_agreement: document.getElementById("family_agreement").checked,
                follow_up_agreement: document.getElementById("follow_up_agreement").checked,
                responsibility_agreement: document.getElementById("responsibility_agreement").checked
            };

            if (!confirmations.family_agreement || !confirmations.follow_up_agreement || !confirmations.responsibility_agreement) {
                alert("請先勾選領養前確認事項");
                return;
            }

            const formData = {
                pet_id: petIdInput.value.trim(),
                name: document.getElementById("name").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                email: document.getElementById("email").value.trim(),
                housing_type: document.getElementById("housing_type").value,
                pet_allowed: document.getElementById("pet_allowed").value,
                has_other_pets: document.getElementById("has_other_pets").value,
                daily_company_time: document.getElementById("daily_company_time").value,
                experience: document.getElementById("experience").value,
                message: document.getElementById("message").value.trim(),
                applicant_username: currentUser ? currentUser.username : "",
                ...confirmations
            };

            if (!formData.pet_id) {
                alert("缺少寵物 ID，請回寵物詳細頁重新申請");
                return;
            }

            fetch("http://localhost:5000/adopt/submit-adoption", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                return response.json().then(data => {
                    throw new Error(data.error || "送出領養申請失敗");
                });
            })
            .then(data => {
                alert(data.message || "領養申請已送出");
                window.location.href = currentUser ? "/profile" : "/";
            })
            .catch(error => {
                console.error("Adoption request error:", error);
                alert(error.message || "送出申請時發生錯誤");
            });
        });
    </script>
</body>
</html>
