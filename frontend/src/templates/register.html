<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - 寵物領養平台</title>
    <link rel="stylesheet" href="/src/asserts/styles/styles.css">
    <link rel="icon" href="/src/asserts/favicon.ico" type="image/x-icon">
</head>
<body class="auth-page">
    <header class="auth-header">
        <a href="/" class="auth-brand">寵物領養平台</a>
        <a href="/login" class="button">登入</a>
    </header>

    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-card-header">
                <p class="auth-kicker">建立帳號</p>
                <h1>加入會員</h1>
                <p>填寫基本資料，之後可以更方便追蹤領養申請。</p>
            </div>

            <form id="register-form" class="auth-form">
                <div class="auth-field">
                    <label for="username">使用者名稱</label>
                    <input type="text" id="username" name="username" placeholder="請輸入使用者名稱" required>
                </div>

                <div class="auth-field">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" placeholder="請輸入密碼" required>
                </div>

                <div class="auth-field">
                    <label for="phone">電話號碼</label>
                    <input type="text" id="phone" name="phone" placeholder="請輸入電話號碼" required>
                </div>

                <div class="auth-field">
                    <label for="address">住址</label>
                    <input type="text" id="address" name="address" placeholder="請輸入住址" required>
                </div>

                <button type="submit" class="auth-submit">註冊</button>
            </form>

            <p class="auth-switch">已經有帳號？<a href="/login">前往登入</a></p>
        </section>
    </main>

    <script>
        document.getElementById("register-form").addEventListener("submit", function(event) {
            event.preventDefault();

            const formData = {
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim()
            };

            if (!formData.username || !formData.password || !formData.phone || !formData.address) {
                alert("請完整填寫註冊資料");
                return;
            }

            fetch("http://localhost:5000/api/user/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error("使用者名稱可能已被註冊");
            })
            .then(data => {
                alert(data.message || "註冊成功");
                window.location.href = "/login";
            })
            .catch(error => {
                console.error("註冊錯誤:", error);
                alert(error.message || "註冊時發生錯誤");
            });
        });
    </script>
</body>
</html>
